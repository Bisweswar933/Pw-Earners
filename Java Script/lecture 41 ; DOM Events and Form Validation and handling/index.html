<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

 
    <form action="" id="form">
        <div>
            <label for="username">Name :</label>
            <input type="text" id="username" placeholder="Enter your name">
            <span class="error-message" id="error"></span>
        </div>

        <div>
            <label for="email">Email :</label>
            <input type="email" id="email" placeholder="Enter your email">
            <span class="error-message" id="error"></span>
        </div>

        <div>
            <label for="password">Passsword :</label>
            <input type="password" id="password" placeholder="Enter your password">
            <span class="error-message" id="error"></span>
        </div>

        <p id="password-hint" class="hidden">Must be 8 character</p>

        <div>
            <label for="bio">bio:</label>
            <textarea name="bio" id="bio" placeholder="Enter your bio..."></textarea>
            <p id="char-count"> </p>
            <span class="error-message" id="error"></span>
        </div>

        <div>
            <label for="country">select your country</label>
            <select name="country" id="country">
                <option value="india">india</option>
                <option value="nepal bhai titan">nepal</option>
                <option value="uk">uk</option>
                <option value="usa">usa</option>
            </select>
            <span class="error-message" id="error"></span>
        </div>

        <div>
            <input type="checkbox" id="checkbox">
            <label for="checkbox">I am agree with term & condition</label>
        </div>


        <button type="submit" id="btn">login</button>
    </form> 

    <h1 class="hidden">Account created sucsussfully</h1>
    <script src="index.js"></script>
</body>

</html>
