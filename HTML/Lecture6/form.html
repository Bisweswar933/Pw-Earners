<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>forms</h1>
    <div>
        <form action="welcome.html" target="_blank">

            <fieldset>

                <legend>Enter your basic information</legend>
                <label for="full name">full name:</label>
                <input type="text" id="full name" placeholder="Enter your name" required>

                <br> <br>

                <label for="email"> email:</label>
                <input type="email" id="email" placeholder="Enter your gmail" required>

                <br> <br>

                <label for="password">password</label>
                <input type="password" id="password" placeholder="Enter your password" required>

                <br> <br>

                <label for="checkbox">Are you 18+ ? :</label>
                <input type="checkbox" id="check box" required>

                <br> <br>

                <label for="phonenumber">Enter your phonenumber? </label>
                <input type="number" id="phonenumber" required min="0">

                <br> <br>

                <label for="male">Enter your gender: </label>
                <label for="male">male</label>
                <input type="radio" id="male" name="gender" required>
                <label for="female">female </label>
                <input type="radio" id="female" name="gender" required>

                <br> <br>

                <label for="file">Upload your photo: </label>
                <input type="file" id="file" required>

                <br> <br>
                <label for="city">select ypur city: </label>
                <select name="city" id="city">
                    <option value="delhi">delhi</option>
                    <option value="balasore">balasore</option>
                    <option value="bhubenswar">bhubenswar</option>
                    <option value="puri">puri</option>
                    <option value="bhadrak">bhadrak</option>
                </select>
                <br><br>

                <button type="submit"> submit form</button>

            </fieldset>

        </form>
    </div>
</body>

</html>
